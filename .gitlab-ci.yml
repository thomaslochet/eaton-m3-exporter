stages:
  - build
  - scan

workflow:
  auto_cancel:
    on_new_commit: interruptible

variables:
  KANIKO_IMAGE: "gcr.io/kaniko-project/executor:v1.24.0-debug"
  TRIVY_CACHE_DIR: ".trivycache/"
  APP_IMAGE: "${CI_REGISTRY}/${CI_REGISTRY_PROJECT}/${CI_PROJECT_NAME}"

.kaniko-build:
  stage: build
  image:
    name: "$KANIKO_IMAGE"
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
  script:
    - |
      /kaniko/executor \
      --context "$CI_PROJECT_DIR" \
      --dockerfile "$CI_PROJECT_DIR/Dockerfile" \
      --destination "$APP_IMAGE:$IMAGE_TAG" \
      $EXTRA_DESTINATIONS
  after_script:
    - rm -f /kaniko/.docker/config.json

.trivy-image-scan:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
  cache:
    key: trivy-cache
    paths:
      - .trivycache/
  script:
    - trivy --version
    - trivy image --severity HIGH,CRITICAL --format template --template "@/contrib/gitlab.tpl" --output gl-container-scanning-report.json --no-progress "$TRIVY_IMAGE"
    - trivy image --severity HIGH,CRITICAL --exit-code 1 --no-progress "$TRIVY_IMAGE"
  artifacts:
    when: always
    reports:
      container_scanning: gl-container-scanning-report.json
    paths:
      - gl-container-scanning-report.json
    expire_in: 1 week

build:dev:
  extends: .kaniko-build
  variables:
    IMAGE_TAG: "$CI_COMMIT_REF_SLUG"
    EXTRA_DESTINATIONS: "--destination $APP_IMAGE:${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA} --destination $APP_IMAGE:dev"
  rules:
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "main"'

scan:dev:
  extends: .trivy-image-scan
  allow_failure: true
  needs:
    - build:dev
  variables:
    TRIVY_IMAGE: "$APP_IMAGE:$CI_COMMIT_REF_SLUG"
  rules:
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "main"'

build:main:
  extends: .kaniko-build
  interruptible: true
  variables:
    IMAGE_TAG: "main"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

scan:main:
  extends: .trivy-image-scan
  allow_failure: true
  interruptible: true
  needs:
    - build:main
  variables:
    TRIVY_IMAGE: "$APP_IMAGE:main"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

build:production:
  extends: .kaniko-build
  variables:
    IMAGE_TAG: "$CI_COMMIT_TAG"
    EXTRA_DESTINATIONS: "--destination $APP_IMAGE:latest"
  rules:
    - if: '$CI_COMMIT_TAG'

scan:production:
  extends: .trivy-image-scan
  allow_failure: true
  needs:
    - build:production
  variables:
    TRIVY_IMAGE: "$APP_IMAGE:$CI_COMMIT_TAG"
  rules:
    - if: '$CI_COMMIT_TAG'
